<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 164" width="164" height="164">
  <style>
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .rotating-ring {
      transform-origin: 82px 82px;
      animation: spin 8s linear infinite;
    }
  </style>
  <!-- Stationary Central Emblem -->
  <image href="data:image/png;base64," x="0" y="0" width="164" height="164" />
  <!-- Continuously Rotating Outer Ring -->
  <g class="rotating-ring">
    <image href="data:image/png;base64," x="0" y="0" width="164" height="164" />
  </g>
</svg>
